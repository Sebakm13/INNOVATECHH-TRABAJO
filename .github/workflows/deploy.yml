name: Deploy Innovatech to AWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy and Run Docker via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USER }}
        key: ${{ secrets.AWS_KEY }}
        script: |
          echo "¡Conectado con éxito a AWS!"
          
          # 1. Crear o entrar a la carpeta en tu máquina virtual
          mkdir -p /home/ubuntu/proyecto-innovatech-unico
          cd /home/ubuntu/proyecto-innovatech-unico

          # 2. Apagar lo que esté corriendo antes para que no se pise
          sudo docker-compose down --remove-orphans || true
          
          # 3. Traer el código real que subiste por la web
          if [ -d ".git" ]; then
            sudo git reset --hard
            sudo git pull origin main
          else
            sudo git clone https://github.com/Sebakm13/INNOVATECH-TRABAJO.git .
          fi

          # 4. Compilar los Dockerfiles reales y levantar el sistema
          sudo docker-compose up --build -d

          # 5. Mostrar en consola que los contenedores quedaron activos
          sudo docker ps
