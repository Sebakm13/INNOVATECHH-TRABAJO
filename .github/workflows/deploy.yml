name: Pipeline CI/CD Monorepo Innovatech

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # CAJITA 1: Compilar y verificar (Build)
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar entorno de simulación
      run: |
        echo "Validando estructura de Innovatech-frontend..."
        echo "Validando estructura de innovatech-backend..."
        echo "Código listo para ser desplegado."

  # CAJITA 2: El despliegue real en tu servidor AWS (Deploy)
  deploy-to-aws:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Desplegar en AWS EC2 vía SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USER }}
        key: ${{ secrets.AWS_KEY }}
        script: |
          echo "¡Conectado con éxito a AWS vía SSH!"
          
          # 1. Crear o entrar al directorio correcto del repositorio
          mkdir -p /home/ubuntu/INNOVATECHH-TRABAJO
          cd /home/ubuntu/INNOVATECHH-TRABAJO
          
          # 2. Sincronizar el código con los nuevos Dockerfiles y el docker-compose
          if [ -d ".git" ]; then
            sudo git reset --hard
            sudo git pull origin main
          else
            sudo git clone https://github.com/Sebakm13/INNOVATECHH-TRABAJO.git .
          fi
          
          # 3. Detener servicios antiguos de forma limpia
          sudo docker-compose down --remove-orphans || true
          
          # 4. Construir y levantar todo el stack (Front, Back Ventas, Back Despachos, MySQL)
          sudo docker-compose up --build -d
          
          # 5. Mostrar en el log de GitHub si quedaron activos
          sudo docker ps
