name: Pipeline CI/CD Monorepo Innovatech

on:
  push:
    branches: 
      - deploy # Corregido según rúbrica: Debe activarse en la rama deploy
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Login a Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build y push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./Innovatech-frontend/front_despacho
        file: ./Innovatech-frontend/Dockerfile
        push: true
        tags: sebakm12333/innovatech-frontend:latest

    - name: Build y push Backend Despachos
      uses: docker/build-push-action@v5
      with:
        context: ./innovatech-backend/back-Despachos_SpringBoot
        file: ./innovatech-backend/back-Despachos_SpringBoot/Dockerfile
        push: true
        tags: sebakm12333/innovatech-backend-despachos:latest

    - name: Build y push Backend Ventas
      uses: docker/build-push-action@v5
      with:
        context: ./innovatech-backend/back-Ventas_SpringBoot
        file: ./innovatech-backend/back-Ventas_SpringBoot/Dockerfile
        push: true
        tags: sebakm12333/innovatech-backend-ventas:latest

  deploy-to-aws:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
    - name: Desplegar en AWS EC2 vía SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USER }}
        key: ${{ secrets.AWS_KEY }}
        command_timeout: 45m
        script: |
          echo "Conectado a AWS EC2"
          
          # Validar e instalar docker-compose v2 si falta
          if ! command -v docker-compose &> /dev/null; then
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            sudo curl -SL "https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-linux-x86_64" -o /usr/local/lib/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          fi
          
          # Variable dinámica para la ruta del HOME del usuario de AWS
          USER_HOME="/home/${{ secrets.AWS_USER }}"
          cd $USER_HOME
          
          # Limpieza de la versión anterior para evitar conflictos de almacenamiento
          if [ -d "INNOVATECHH-TRABAJO" ]; then
            cd INNOVATECHH-TRABAJO
            sudo docker compose down --remove-orphans || true
            cd $USER_HOME
          fi
          
          sudo rm -rf INNOVATECHH-TRABAJO
          
          # Forzar detención y purga para liberar los puertos expuestos
          sudo docker ps -aq | xargs -r sudo docker stop || true
          sudo docker ps -aq | xargs -r sudo docker rm || true
          sudo docker system prune -f || true
          
          # Descarga limpia del repositorio
          git clone https://github.com/Sebakm13/INNOVATECHH-TRABAJO.git
          cd $USER_HOME/INNOVATECHH-TRABAJO
          
          # Descarga de las imágenes nuevas creadas en el job anterior y despliegue del stack
          sudo docker compose -f docker-compose.prod.yml pull
          sudo docker compose -f docker-compose.prod.yml up -d
          
          # Espera prudente de inicialización de SpringBoot y Frontend antes del chequeo final
          sleep 20
          sudo docker compose -f docker-compose.prod.yml ps
