name: Pipeline CI/CD Monorepo Innovatech

on:
  push:
    branches: 
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login a Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build y push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./Innovatech-frontend/front_despacho
        file: ./Innovatech-frontend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-frontend:latest
        build-args: |
          NPM_CONFIG_AUDIT=false
          NPM_CONFIG_FUND=false
          NODE_ENV=production

    - name: Build y push Backend Despachos
      uses: docker/build-push-action@v5
      with:
        context: ./innovatech-backend/back-Despachos_SpringBoot
        file: ./innovatech-backend/back-Despachos_SpringBoot/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend-despachos:latest

    - name: Build y push Backend Ventas
      uses: docker/build-push-action@v5
      with:
        context: ./innovatech-backend/back-Ventas_SpringBoot
        file: ./innovatech-backend/back-Ventas_SpringBoot/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend-ventas:latest

  deploy-to-aws:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
    - name: Desplegar en AWS EC2 vía SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USER }}
        key: ${{ secrets.AWS_KEY }}
        port: 22
        timeout: 30s
        command_timeout: 15m
        script: |
          set -e
          export DEBIAN_FRONTEND=noninteractive

          # Instalar docker compose v2 si no existe
          if ! docker compose version &> /dev/null; then
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            sudo curl -fsSL "https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-linux-x86_64" \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          fi

          DEPLOY_DIR="/home/${{ secrets.AWS_USER }}/innovatech_deploy"

          # Bajar contenedores previos
          if [ -d "$DEPLOY_DIR" ]; then
            cd "$DEPLOY_DIR"
            sudo docker compose down --remove-orphans --timeout 10 || true
            cd ~
            sudo rm -rf "$DEPLOY_DIR"
          fi

          # Limpiar todo sin confirmación
          sudo docker rm -f $(sudo docker ps -aq) 2>/dev/null || true
          sudo docker system prune -af --volumes 2>/dev/null || true

          # Crear directorio de deploy
          mkdir -p "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"

          # Generar docker-compose.prod.yml
          cat > docker-compose.prod.yml << 'EOF'
          version: '3.8'
          services:
            frontend:
              image: ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-frontend:latest
              ports:
                - "80:80"
              restart: always
              networks:
                - innovatech_net

            backend-despachos:
              image: ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend-despachos:latest
              ports:
                - "8081:8081"
              restart: always
              networks:
                - innovatech_net

            backend-ventas:
              image: ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend-ventas:latest
              ports:
                - "8082:8082"
              restart: always
              networks:
                - innovatech_net

          networks:
            innovatech_net:
              driver: bridge
          EOF

          # Pull e inicio
          sudo docker compose -f docker-compose.prod.yml pull
          sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans

          echo "✅ Deploy exitoso"
