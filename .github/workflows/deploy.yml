name: Pipeline CI/CD Monorepo Innovatech

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # CAJITA 1: Compilar y verificar (Build)
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar entorno de simulación
      run: |
        echo "Validando estructura de Innovatech-frontend..."
        echo "Validando estructura de innovatech-backend..."
        echo "Código listo para ser desplegado."

  # CAJITA 2: El despliegue real en tu servidor AWS (Deploy)
  deploy-to-aws:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Desplegar en AWS EC2 vía SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USER }}
        key: ${{ secrets.AWS_KEY }}
        script: |
          echo "¡Conectado con éxito a AWS vía SSH!"
          
          # 1. Crear o entrar al directorio de trabajo con el usuario estándar
          mkdir -p /home/ubuntu/INNOVATECHH-TRABAJO
          cd /home/ubuntu/INNOVATECHH-TRABAJO
          
          # 2. Detener y limpiar a fondo contenedores o recursos huérfanos antes de actualizar
          sudo docker-compose down --remove-orphans || true
          sudo docker system prunes -f || true
          
          # 3. Sincronizar el código SIN sudo para evitar bloqueos de permisos No-Root
          if [ -d ".git" ]; then
            git reset --hard
            git pull origin main
          else
            rm -rf * .git || true
            git clone https://github.com/Sebakm13/INNOVATECHH-TRABAJO.git .
          fi
          
          # 4. Asegurar que los usuarios internos de los Dockerfiles tengan acceso de lectura
          sudo chown -R ubuntu:ubuntu /home/ubuntu/INNOVATECHH-TRABAJO
          sudo chmod -R 755 /home/ubuntu/INNOVATECHH-TRABAJO
          
          # 5. Construir y levantar el stack completo con las rutas corregidas
          sudo docker-compose up --build -d
          
          # 6. Esperar 5 segundos y verificar qué contenedores quedaron realmente corriendo
          sleep 5
          sudo docker ps
