name: CI/CD Pipeline - Innovatech

on:
  push:
    branches:
      - deploy # Trigger obligatorio según pauta

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      # Autenticación en Docker Hub (o AWS ECR si lo prefieres)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construcción y subida de la imagen
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Conexión SSH a tu instancia EC2 de AWS para actualizar el contenedor
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user # o ubuntu dependiendo de tu AMI
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-app:latest
            # Aquí detienes el contenedor viejo y corres el nuevo, o ejecutas docker-compose
            cd /home/ec2-user/proyecto
            sudo docker-compose down
            sudo docker-compose up -d
