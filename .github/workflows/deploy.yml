name: Pipeline CI/CD Monorepo Innovatech

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login a Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build y push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./Innovatech-frontend/front_despacho
        file: ./Innovatech-frontend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-frontend:latest
        build-args: |
          NPM_CONFIG_AUDIT=false
          NPM_CONFIG_FUND=false
          NODE_ENV=production

    - name: Build y push Backend Despachos
      uses: docker/build-push-action@v5
      with:
        context: ./innovatech-backend/back-Despachos_SpringBoot
        file: ./innovatech-backend/back-Despachos_SpringBoot/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend-despachos:latest

    - name: Build y push Backend Ventas
      uses: docker/build-push-action@v5
      with:
        context: ./innovatech-backend/back-Ventas_SpringBoot
        file: ./innovatech-backend/back-Ventas_SpringBoot/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend-ventas:latest

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
    - name: Desplegar Frontend en EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_HOST_FRONTEND }}
        username: ${{ secrets.AWS_USER }}
        key: ${{ secrets.AWS_KEY }}
        port: 22
        timeout: 30s
        command_timeout: 10m
        script: |
          export DEBIAN_FRONTEND=noninteractive
          sudo docker rm -f innovatech-frontend 2>/dev/null || true
          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-frontend:latest
          sudo docker run -d \
            --name innovatech-frontend \
            --restart always \
            -p 80:80 \
            ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-frontend:latest
          echo "✅ Frontend desplegado"

  deploy-backend:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
    - name: Desplegar Backend en EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_HOST_BACKEND }}
        username: ${{ secrets.AWS_USER }}
        key: ${{ secrets.AWS_KEY }}
        port: 22
        timeout: 30s
        command_timeout: 10m
        script: |
          export DEBIAN_FRONTEND=noninteractive
          sudo docker rm -f innovatech-backend-despachos 2>/dev/null || true
          sudo docker rm -f innovatech-backend-ventas 2>/dev/null || true
          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend-despachos:latest
          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend-ventas:latest
          sudo docker run -d \
            --name innovatech-backend-despachos \
            --restart always \
            -p 8081:8081 \
            ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend-despachos:latest
          sudo docker run -d \
            --name innovatech-backend-ventas \
            --restart always \
            -p 8082:8082 \
            ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-backend-ventas:latest
          echo "✅ Backends desplegados"
