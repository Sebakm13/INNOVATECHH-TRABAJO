name: Pipeline CI/CD Monorepo Innovatech

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # CAJITA 1: Compilar y verificar (Build)
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar entorno de simulación
      run: |
        echo "Validando estructura de Innovatech-frontend..."
        echo "Validando estructura de innovatech-backend..."
        echo "Código listo para ser desplegado."

  # CAJITA 2: El despliegue real en tu servidor AWS (Deploy)
  deploy-to-aws:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Desplegar en AWS EC2 vía SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USER }}
        key: ${{ secrets.AWS_KEY }}
        script: |
          echo "¡Conectado con éxito a AWS vía SSH!"
          
          # 1. Crear o entrar al directorio correcto
          mkdir -p /home/ubuntu/INNOVATECHH-TRABAJO
          cd /home/ubuntu/INNOVATECHH-TRABAJO
          
          # 2. Detener contenedores antiguos de forma limpia si existen
          sudo docker-compose down --remove-orphans || true
          sudo docker system prune -f || true
          
          # 3. Sincronizar el código de GitHub a la máquina de AWS
          if [ -d ".git" ]; then
            git reset --hard
            git pull origin main
          else
            rm -rf * .git || true
            git clone https://github.com/Sebakm13/INNOVATECHH-TRABAJO.git .
          fi
          
          # 4. Asegurar permisos para usuarios No-Root
          sudo chown -R ubuntu:ubuntu /home/ubuntu/INNOVATECHH-TRABAJO
          sudo chmod -R 755 /home/ubuntu/INNOVATECHH-TRABAJO
          
          # 5. Construir y levantar todo el stack
          sudo docker-compose up --build -d
          
          # 6. Esperar a que inicien y revisar si están corriendo o se cayeron
          echo "Esperando que los servicios levanten..."
          sleep 10
          echo "=== CONTENEDORES ACTIVOS ==="
          sudo docker ps
          echo "=== CONTENEDORES CAÍDOS O CON ERROR ==="
          sudo docker ps -a
